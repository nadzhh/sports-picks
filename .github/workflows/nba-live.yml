name: NBA live (blessures, lignes, avant-match)

# Veille NBA (nba_live.py) : resimule un match quand une information arrive (rapport officiel
# des blessures toutes les 15 min, ligne Vegas qui bouge, props publiees) et une derniere fois
# ~35 min avant le coup d'envoi ; publie nba_sim.html + donnees NBA, jamais index.html (possede
# par le cron principal : fichiers disjoints, donc pas de conflit entre les deux workflows).
#
# Le cron GitHub n'est pas fiable sur ce depot (27-28/10 : « */30 » et « 11 * * * » = un passage
# toutes les 3 a 6 h, voire aucun). La veille boucle donc dans le job (cycle 10 min a moins de 6 h
# d'un match, 30 min sinon) et, a la fin de son budget, RELANCE ELLE-MEME le workflow tant que des
# matchs arrivent dans les 36 h (workflow_dispatch, autorise avec le GITHUB_TOKEN). Pas de relance
# si le job echoue (pas de boucle d'erreurs) : le cron horaire sert alors de filet.
# Un push qui modifie la veille la (re)demarre. Arret : desactiver le workflow dans l'onglet Actions.
on:
  schedule:
    - cron: "11 * * * *"
  workflow_dispatch:
  push:
    branches: [master]
    paths: ["nba_live.py", ".github/workflows/nba-live.yml"]

permissions:
  contents: write
  actions: write

concurrency:
  group: nba-live
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: master          # toujours le code le plus recent (un run en file attend parfois des heures)
          fetch-depth: 20
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure git
        run: |
          git config --global user.name  "sport-picks-bot"
          git config --global user.email "actions@github.com"

      # Seulement ce qu'utilise la chaine NBA (pas Playwright / Camoufox du pipeline foot)
      - name: Install Python deps
        run: pip install numpy requests pdfplumber

      - name: Cache base NBA
        uses: actions/cache@v4
        with:
          path: data/nba_db
          key: nba-db-live-${{ github.run_id }}
          restore-keys: |
            nba-db-live-
            nba-db-

      - name: Veille
        env:
          PYTHONIOENCODING: utf-8
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}   # paris de la Bankroll IA
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python nba_live.py --loop --max-minutes 330

      # Alerte : la veille a plante (elle ne se relance pas seule dans ce cas). Jeton lu par
      # notify.py dans l'environnement, jamais sur la ligne de commande.
      - name: Alerte Telegram si echec
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python -c "import os, notify; notify.tg_send('⚠️ Veille NBA arrêtée sur une erreur, la Bankroll IA ne parie plus. ' + os.environ['RUN_URL'])"

      - name: Relance de la veille
        if: success() && hashFiles('.nba_live_continue') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run nba-live.yml --ref master
